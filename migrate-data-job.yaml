apiVersion: batch/v1
kind: Job
metadata:
  name: aggrovites-migrate-data
  namespace: aggrovites
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate-data
        image: paulgmiller/aggrovites:cockroach-20261004-1
        command: ["/app", "migrate-data"]
        env:
        - name: DATABASE_URL
          value: postgresql://root@cockroachdb-public.cockroach.svc.cluster.local:26257/defaultdb?sslmode=disable
        - name: MSSQL_DSN
          valueFrom:
            secretKeyRef:
              name: aggrovites
              key: MSSQL_DSN
